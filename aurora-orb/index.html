<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="description" content="Aurora Orb：会被鼠标扰动、会注视并回应你的液体彩虹表情球。" />
<title>Aurora Orb · Morph Bot</title>
<link rel="stylesheet" href="./aurora-orb.css" />
</head>
<body>
<main class="orb-stage">
  <canvas id="gl" aria-label="可用鼠标扰动的 Aurora 液体球"></canvas>

  <morph-bot
    id="orb-face"
    state="idle"
    shape="blob"
    color="transparent"
    eye-color="#21356a"
    follow-pointer
    thumbnail
    label="Aurora Orb，待机"
  ></morph-bot>

  <header class="orb-header">
    <a class="back-link" href="../component/" aria-label="返回 Morph Bot 组件编辑器">
      <span aria-hidden="true">&#8592;</span>
      <span>Morph Bot</span>
    </a>
    <div class="state-readout" aria-live="polite">
      <span class="state-pulse" aria-hidden="true"></span>
      <span id="current-state-zh">待机</span>
      <span id="current-state-en">Idle</span>
    </div>
  </header>

  <section class="expression-dock" aria-label="Aurora Orb 表情控制">
    <div class="dock-heading">
      <p class="eyebrow">表情状态 · 23</p>
      <div class="dock-actions">
        <details id="eye-settings" class="eye-settings">
          <summary class="utility-button">眼睛设置 <span aria-hidden="true">↗</span></summary>
          <div class="eye-config-panel">
            <div class="eye-config-heading">
              <div><strong>眼睛外观</strong><small>修改会立即显示</small></div>
              <button id="reset-eye-config" type="button">恢复默认</button>
            </div>

            <label class="eye-field eye-field-wide">
              <span>材质预设</span>
              <select id="eye-preset">
                <option value="deep-glass">深海玻璃</option>
                <option value="aurora">极光薄膜</option>
                <option value="pearl">冰晶珍珠</option>
                <option value="ink">墨色内嵌</option>
                <option value="custom">自定义</option>
              </select>
            </label>

            <label class="eye-field">
              <span>颜色 <output id="eye-color-value">#21356A</output></span>
              <input id="eye-color" type="color" value="#21356a" />
            </label>

            <label class="eye-field">
              <span>透明度 <output id="eye-opacity-value">90%</output></span>
              <input id="eye-opacity" type="range" min="30" max="100" step="1" value="90" />
            </label>

            <label class="eye-field eye-field-wide">
              <span>尺寸 <output id="eye-scale-value">92%</output></span>
              <input id="eye-scale" type="range" min="70" max="120" step="1" value="92" />
            </label>

            <label class="eye-field eye-field-wide">
              <span>混合模式</span>
              <select id="eye-blend-mode">
                <option value="normal">正常 Normal</option>
                <option value="multiply">正片叠底 Multiply</option>
                <option value="screen">滤色 Screen</option>
                <option value="overlay">叠加 Overlay</option>
                <option value="darken">变暗 Darken</option>
                <option value="lighten">变亮 Lighten</option>
                <option value="color-dodge">颜色减淡 Color dodge</option>
                <option value="color-burn">颜色加深 Color burn</option>
                <option value="hard-light">强光 Hard light</option>
                <option value="soft-light">柔光 Soft light</option>
                <option value="difference">差值 Difference</option>
                <option value="exclusion">排除 Exclusion</option>
                <option value="hue">色相 Hue</option>
                <option value="saturation">饱和度 Saturation</option>
                <option value="color">颜色 Color</option>
                <option value="luminosity" selected>明度 Luminosity</option>
                <option value="plus-darker">加深 Plus darker</option>
                <option value="plus-lighter">提亮 Plus lighter</option>
              </select>
            </label>
          </div>
        </details>
        <button id="responsive-toggle" class="utility-button is-on" type="button" aria-pressed="true">鼠标响应 <span>开</span></button>
        <button id="random-state" class="utility-button" type="button">随机表情</button>
        <button id="autoplay-state" class="utility-button" type="button" aria-pressed="false">自动播放 <span>关</span></button>
      </div>
    </div>
    <div id="expression-list" class="expression-list" role="listbox" aria-label="全部表情状态"></div>
    <div class="interaction-hint" aria-hidden="true">
      <span>移动 · 注视</span>
      <i></i>
      <span>拖动 · 搅动液体</span>
      <i></i>
      <span>按住 · 惊讶</span>
    </div>
  </section>

  <p id="webgl-fallback" class="webgl-fallback" hidden>这个实验需要浏览器支持 WebGL。</p>
</main>
<script>
(() => {
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl', {
    antialias: true,
    alpha: false,
    depth: false,
    stencil: false,
    premultipliedAlpha: false,
    powerPreference: 'high-performance'
  });

  if (!gl) {
    canvas.hidden = true;
    document.getElementById('webgl-fallback').hidden = false;
    return;
  }

  const vertexShader = `
    attribute vec2 aPosition;
    void main(){
      gl_Position = vec4(aPosition, 0.0, 1.0);
    }
  `;

  const fragmentShader = `
    precision highp float;

    uniform vec2 uResolution;
    uniform vec2 uPointer;
    uniform vec2 uPointerTrail;
    uniform vec2 uPointerVelocity;
    uniform float uPointerDown;
    uniform float uPointerActive;
    uniform float uTime;
    uniform sampler2D uTexture;

    const float ORB_R = 0.3010;
    const int STEPS = 12;
    const float PI = 3.14159265359;

    float hash21(vec2 p){
      p = fract(p * vec2(234.34, 842.21));
      p += dot(p, p + 34.45);
      return fract(p.x * p.y);
    }

    float noise2(vec2 p){
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash21(i);
      float b = hash21(i + vec2(1.0, 0.0));
      float c = hash21(i + vec2(0.0, 1.0));
      float d = hash21(i + vec2(1.0, 1.0));
      return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
    }

    float fbm2(vec2 p){
      float v = 0.0;
      float a = 0.5;
      mat2 r = mat2(0.82, -0.57, 0.57, 0.82);
      for(int i=0;i<5;i++){
        v += a * noise2(p);
        p = r * p * 1.95 + 0.23;
        a *= 0.52;
      }
      return v;
    }

    vec3 angularRim(float a) {
      vec3 cyan   = vec3(0.02, 0.76, 1.00);
      vec3 pearl  = vec3(0.80, 0.96, 1.00);
      vec3 pink   = vec3(1.00, 0.08, 0.70);
      vec3 violet = vec3(0.33, 0.02, 0.98);
      vec3 cobalt = vec3(0.00, 0.20, 1.00);

      vec2 dir = vec2(cos(a), sin(a));
      float leftW   = pow(max(0.0, -dir.x), 2.0);
      float topW    = pow(max(0.0,  dir.y), 3.1);
      float rightW  = pow(max(0.0,  dir.x), 2.35);
      float bottomW = pow(max(0.0, -dir.y), 2.3);

      vec3 c = cyan * leftW + pearl * topW + pink * rightW + mix(cobalt, violet, 0.60) * bottomW;
      return c / (leftW + topW + rightW + bottomW + 1e-5);
    }

    vec3 centerA(float t){ return vec3(-0.34 + 0.10*sin(t*0.42),  0.34 + 0.08*cos(t*0.37),  0.14*sin(t*0.31)); }
    vec3 centerB(float t){ return vec3( 0.18 + 0.12*cos(t*0.34), -0.26 + 0.10*sin(t*0.39), -0.16 + 0.12*cos(t*0.29)); }
    vec3 centerC(float t){ return vec3( 0.46 + 0.08*sin(t*0.35), -0.16 + 0.07*cos(t*0.28),  0.02 + 0.10*sin(t*0.46)); }
    vec3 centerD(float t){ return vec3(-0.18 + 0.11*cos(t*0.25), -0.46 + 0.08*sin(t*0.33),  0.13*cos(t*0.26)); }

    vec4 metaField(vec3 p, float t){
      vec3 c1 = centerA(t);
      vec3 c2 = centerB(t);
      vec3 c3 = centerC(t);
      vec3 c4 = centerD(t);
      float r1 = 0.48, r2 = 0.60, r3 = 0.42, r4 = 0.40;

      vec3 d1 = p - c1;
      vec3 d2 = p - c2;
      vec3 d3 = p - c3;
      vec3 d4 = p - c4;

      float w1 = (r1*r1) / (dot(d1,d1) + 0.06);
      float w2 = (r2*r2) / (dot(d2,d2) + 0.08);
      float w3 = (r3*r3) / (dot(d3,d3) + 0.05);
      float w4 = (r4*r4) / (dot(d4,d4) + 0.04);

      float density = w1 + w2 + w3 + w4;
      vec3 flow =
        (-d1) * w1 * 0.85 +
        (-d2) * w2 * 0.65 +
        (-d3) * w3 * 1.00 +
        (-d4) * w4 * 0.80;

      return vec4(flow, density);
    }

    vec3 sampleReference(vec2 uv, vec2 dir, float chroma){
      float r = texture2D(uTexture, uv + dir * chroma).r;
      float g = texture2D(uTexture, uv).g;
      float b = texture2D(uTexture, uv - dir * chroma).b;
      return vec3(r, g, b);
    }

    void main(){
      vec2 res = uResolution;
      float scale = min(res.x, res.y);
      vec2 q = (gl_FragCoord.xy - 0.5 * res) / scale;
      vec2 uv = q + 0.5;

      vec2 local = q / ORB_R;
      float rr = dot(local, local);
      float edgeR = sqrt(max(rr, 0.0));

      if (rr >= 1.03) {
        float halo = exp(-max(length(q) - ORB_R, 0.0) * scale * 0.058);
        vec3 haloColor = vec3(0.004, 0.007, 0.019) * halo * 0.32;
        gl_FragColor = vec4(haloColor, 1.0);
        return;
      }

      float z = sqrt(max(1.0 - rr, 0.0));
      vec3 n = normalize(vec3(local, z));
      float fresnel = pow(1.0 - max(n.z, 0.0), 2.35);
      float innerSafe = smoothstep(0.0, 0.22, 1.0 - edgeR);

      // Pointer in the same square coordinate system as q/local.
      vec2 pointerQ = (uPointer - 0.5 * res) / scale;
      pointerQ.y *= -1.0;
      vec2 pointerLocal = pointerQ / ORB_R;
      vec2 trailQ = (uPointerTrail - 0.5 * res) / scale;
      trailQ.y *= -1.0;
      vec2 trailLocal = trailQ / ORB_R;
      vec2 pointerVel = uPointerVelocity * vec2(1.0, -1.0);
      float pointerSpeed = clamp(length(pointerVel) * 2.2, 0.0, 1.0);
      float interaction = uPointerActive;
      float t = uTime;

      // A coherent slow spin around the exact center of the source image.
      float ang = 0.030 * sin(t * 0.31) + 0.010 * sin(t * 0.13);
      float cs = cos(ang), sn = sin(ang);
      mat2 rot = mat2(cs, -sn, sn, cs);
      vec2 centered = uv - 0.5;
      vec2 sampleUV = 0.5 + rot * centered;

      // 3D volumetric metaball field sampled through the sphere.
      float accum = 0.0;
      float accumPearl = 0.0;
      float accumMagenta = 0.0;
      float accumBlue = 0.0;
      vec3 flow = vec3(0.0);
      float stepW = 0.0;

      vec3 front = vec3(local.xy * 0.84, -z * 0.85);
      vec3 back  = vec3(local.xy * 0.84,  z * 0.85);

      for (int i = 0; i < STEPS; i++) {
        float fi = float(i);
        float ft = (fi + 0.5) / float(STEPS);
        vec3 p = mix(front, back, ft);

        float wNoise = fbm2(p.xy * 1.9 + vec2(0.24 * t, -0.17 * t) + p.z * 2.4);
        float wNoise2 = fbm2((p.xy + 2.7) * 1.4 + vec2(-0.15 * t, 0.20 * t) - p.z * 1.8);
        p.xy += vec2(wNoise - 0.5, wNoise2 - 0.5) * 0.15;
        p.z += sin((p.x + p.y) * 2.8 + t * 0.78) * 0.070;

        // Cursor behaves like a magnetic stirrer inside the sphere.
        vec2 rel = p.xy - pointerLocal;
        float pointerInfluence = exp(-dot(rel, rel) * 2.8) * interaction;
        vec2 trailRel = p.xy - trailLocal;
        float trailInfluence = exp(-dot(trailRel, trailRel) * 3.8) * interaction * pointerSpeed;
        vec2 swirl = vec2(-rel.y, rel.x);
        vec2 trailSwirl = vec2(trailRel.y, -trailRel.x);
        p.xy -= pointerLocal * 0.055 * interaction;
        p.xy += swirl * pointerInfluence * (0.045 + 0.15 * pointerSpeed + 0.070 * uPointerDown);
        p.xy += trailSwirl * trailInfluence * (0.035 + 0.095 * uPointerDown);
        p.xy -= pointerVel * (pointerInfluence * 0.070 + trailInfluence * 0.035);

        vec4 mf = metaField(p, t);
        float d = smoothstep(1.20, 2.35, mf.w);
        float w = 0.85 + 0.55 * sin(ft * PI);

        accum += d * w;
        flow += mf.xyz * d * w;
        stepW += w;

        accumPearl += d * smoothstep(0.05, 0.72, p.y + 0.25) * smoothstep(-0.55, 0.10, -p.x) * w;
        accumMagenta += d * smoothstep(0.08, 0.60, p.x) * smoothstep(0.10, -0.62, p.y) * w;
        accumBlue += d * smoothstep(-0.02, 0.70, -p.y) * w;
      }

      accum /= max(stepW, 1e-5);
      flow /= max(stepW, 1e-5);
      accumPearl /= max(stepW, 1e-5);
      accumMagenta /= max(stepW, 1e-5);
      accumBlue /= max(stepW, 1e-5);

      // Stronger globe tilt + local lensing. This is intentionally visible.
      vec2 tilt = clamp(pointerLocal, vec2(-1.25), vec2(1.25));
      vec2 parallax = tilt * (0.013 + 0.026 * (1.0 - z)) * interaction;
      vec2 autoDrift = vec2(
        0.0080 * sin(t * 0.62) + 0.0030 * sin(t * 0.27 + 1.7),
        0.0062 * cos(t * 0.54) + 0.0028 * sin(t * 0.33)
      );
      vec2 volumeOffset = (flow.xy * 0.0145 + vec2(flow.z, -flow.z) * 0.0065) * innerSafe;
      vec2 cavityBias = local * (-0.0075 * accum) * innerSafe;

      vec2 cursorRel = local - pointerLocal;
      float cursorDist2 = dot(cursorRel, cursorRel);
      float lens = exp(-cursorDist2 * 4.2) * interaction;
      vec2 lensDir = normalize(cursorRel + vec2(0.0001));
      vec2 lensOffset = lensDir * lens * (0.010 + 0.020 * pointerSpeed + 0.018 * uPointerDown);
      vec2 velocityShear = pointerVel * lens * (0.012 + 0.020 * pointerSpeed);

      sampleUV += (parallax + autoDrift) * innerSafe + volumeOffset + cavityBias;
      sampleUV += (lensOffset - velocityShear) * innerSafe;

      // Main sample from the supplied reference image.
      vec2 chromaDir = normalize(local + vec2(0.0001));
      float chroma = 0.00105 + 0.00155 * fresnel;
      vec3 col = sampleReference(sampleUV, chromaDir, chroma * 0.75);

      // Refracted secondary taps aligned with the 3D fluid field.
      vec2 softDir = normalize(volumeOffset + vec2(0.0001, -0.0001));
      vec3 soft1 = texture2D(uTexture, sampleUV + softDir * (0.0065 + 0.0040 * accum)).rgb;
      vec3 soft2 = texture2D(uTexture, sampleUV - softDir * (0.0050 + 0.0030 * accum)).rgb;
      col = mix(col, 0.55 * soft1 + 0.45 * soft2, 0.30 + 0.20 * accum);

      // Volume tints: broad masses, not noisy clouds.
      vec3 deepBlue = vec3(0.015, 0.022, 0.17);
      vec3 violet = vec3(0.26, 0.02, 0.80);
      vec3 pearl = vec3(0.68, 0.88, 0.96);
      vec3 magenta = vec3(0.94, 0.06, 0.62);
      vec3 cyan = vec3(0.00, 0.73, 1.00);

      vec3 volumeTint = vec3(0.0);
      volumeTint += mix(deepBlue, violet, 0.55 + 0.35 * sin(t * 0.18)) * accumBlue * 0.16;
      volumeTint += pearl * accumPearl * 0.13;
      volumeTint += magenta * accumMagenta * 0.18;
      volumeTint += cyan * (accum * 0.11) * smoothstep(-0.68, -0.12, local.x);
      col += volumeTint;

      // Keep the center darker, closer to the reference's deep cavity.
      vec2 cavityP = local - vec2(0.08 + 0.028 * sin(t * 0.16), 0.07 + 0.015*cos(t*0.14));
      float cavity = exp(-(cavityP.x*cavityP.x/0.62 + cavityP.y*cavityP.y/0.42) * 2.4);
      col *= 1.0 - cavity * (0.10 + 0.08 * accum);

      // Upper-left pearl highlight, stretched and animated.
      vec2 sheenCenter = vec2(-0.24 + 0.028 * sin(t * 0.29), 0.54 + 0.022 * cos(t * 0.25));
      vec2 sd = local - sheenCenter;
      float sheen = exp(-(sd.x*sd.x/0.68 + sd.y*sd.y/0.17) * 2.4);
      sheen *= smoothstep(0.18, 0.90, local.y + 0.35);
      col += vec3(0.14, 0.19, 0.22) * sheen * (0.32 + 0.12 * sin(t * 0.52));

      // Interactive specular: the glass visibly reacts under the cursor.
      float cursorSpot = exp(-cursorDist2 * 5.4) * interaction;
      float cursorEdge = smoothstep(0.12, 0.95, edgeR);
      vec3 cursorHue = mix(vec3(0.05, 0.56, 0.95), vec3(0.86, 0.08, 0.65), smoothstep(-0.75, 0.75, pointerLocal.x));
      col += cursorHue * cursorSpot * (0.055 + 0.18 * pointerSpeed + 0.10 * uPointerDown) * (0.45 + 0.55 * cursorEdge);

      // Rim and shell lighting.
      float rimBand = smoothstep(0.70, 0.975, edgeR) * (1.0 - smoothstep(0.985, 1.016, edgeR));
      float a = atan(local.y, local.x);
      vec3 rimColor = angularRim(a);
      float rimPulse = 0.78 + 0.22 * sin(t * 0.88 + a * 1.8 + 0.35*sin(t*0.34));
      col += rimColor * rimBand * (0.10 + 0.18 * fresnel) * rimPulse;

      vec2 localDir = normalize(local + vec2(0.0001));
      vec2 pointerDir = normalize(pointerLocal + vec2(0.0001));
      float pointerRim = pow(max(dot(localDir, pointerDir), 0.0), 10.0) * rimBand * interaction;
      col += mix(vec3(0.04,0.56,1.0), vec3(1.0,0.05,0.62), smoothstep(-0.5,0.5,pointerLocal.x))
           * pointerRim * (0.12 + 0.22 * pointerSpeed + 0.10 * uPointerDown);

      // Characteristic lower-right magenta crescent.
      vec2 crescentP = local - vec2(0.44, -0.35);
      float crescentRing = exp(-pow((length(crescentP) - 0.40) / 0.065, 2.0));
      float crescentMask = smoothstep(-0.04, 0.52, local.x) * smoothstep(0.16, -0.78, local.y);
      float crescent = crescentRing * crescentMask * (0.66 + 0.34 * sin(t * 0.58 + 1.0));
      col += vec3(0.22, 0.01, 0.30) * crescent * 0.26;

      // A soft blue left edge and bottom glow to match the source distribution.
      col += vec3(0.00, 0.18, 0.95) * smoothstep(-1.0, -0.24, -local.x) * smoothstep(0.10, 1.0, 1.0 - abs(local.y)) * 0.075;
      col += vec3(0.04, 0.03, 0.70) * smoothstep(-1.0, -0.18, -local.y) * 0.06;

      // Subtle breathing, keeping it alive without visibly pulsing.
      col *= 0.976 + 0.040 * sin(t * 0.50);
      col = clamp(col, 0.0, 1.0);

      float silhouette = 1.0 - smoothstep(0.996, 1.02, edgeR);
      col *= silhouette;
      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compile(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexShader));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentShader));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program));
  }
  gl.useProgram(program);

  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

  const aPosition = gl.getAttribLocation(program, 'aPosition');
  gl.enableVertexAttribArray(aPosition);
  gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

  const uResolution = gl.getUniformLocation(program, 'uResolution');
  const uPointer = gl.getUniformLocation(program, 'uPointer');
  const uPointerTrail = gl.getUniformLocation(program, 'uPointerTrail');
  const uPointerVelocity = gl.getUniformLocation(program, 'uPointerVelocity');
  const uPointerDown = gl.getUniformLocation(program, 'uPointerDown');
  const uPointerActive = gl.getUniformLocation(program, 'uPointerActive');
  const uTime = gl.getUniformLocation(program, 'uTime');
  const uTexture = gl.getUniformLocation(program, 'uTexture');

  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
  gl.uniform1i(uTexture, 0);

  const img = new Image();
  img.decoding = 'async';
  img.onload = () => {
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.uniform2f(uResolution, canvas.width, canvas.height);
    gl.uniform2f(uPointer, pointerX * sx, pointerY * sy);
    gl.uniform2f(uPointerTrail, trailX * sx, trailY * sy);
    gl.uniform2f(uPointerVelocity, velocityX, velocityY);
    gl.uniform1f(uPointerDown, press);
    gl.uniform1f(uPointerActive, active);
    gl.uniform1f(uTime, ((now - start) / 1000.0) * (reduceMotion ? 0.70 : 1.75));
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    const orbRadius = minSide * 0.301;
    const normalizedX = (pointerX - innerWidth * 0.5) / orbRadius;
    const normalizedY = (pointerY - innerHeight * 0.5) / orbRadius;
    window.dispatchEvent(new CustomEvent('aurora-pointer', { detail: {
      x: normalizedX,
      y: normalizedY,
      speed: Math.min(1, Math.hypot(velocityX, velocityY) * 2.2),
      pressed: press > 0.35,
      active: active > 0.08,
      inside: Math.hypot(normalizedX, normalizedY) < 1.04
    }}));

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
<script type="module" src="./aurora-orb.js"></script>
</body>
